<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Atmospheric film set behind the camera</title>
  <desc id="desc">A smoky, cinematic film set in Flat Six Media's racing green, cream, and brass palette, with blurred crew silhouettes behind a camera.</desc>
  <defs>
    <radialGradient id="warmPractical" cx="64%" cy="28%" r="48%">
      <stop offset="0" stop-color="#E8D9B8" stop-opacity="0.9"/>
      <stop offset="0.34" stop-color="#C7A668" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#0B231A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floorGlow" cx="52%" cy="80%" r="62%">
      <stop offset="0" stop-color="#A87B3F" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#1C5440" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0A0A07" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A07"/>
      <stop offset="0.34" stop-color="#0B231A"/>
      <stop offset="0.72" stop-color="#143E2E"/>
      <stop offset="1" stop-color="#161C18"/>
    </linearGradient>
    <linearGradient id="creamBeam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F1" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#E8D9B8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FBF8F1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B231A"/>
      <stop offset="0.48" stop-color="#143E2E"/>
      <stop offset="1" stop-color="#0A0A07"/>
    </linearGradient>
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="motionBlur" x="-45%" y="-30%" width="190%" height="160%">
      <feGaussianBlur stdDeviation="18 4"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="18" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.075"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="soft-light"/>
    </filter>
    <clipPath id="frameClip">
      <rect width="1200" height="1200" rx="76"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frameClip)" filter="url(#grain)">
    <rect width="1200" height="1200" fill="url(#backdrop)"/>
    <rect width="1200" height="1200" fill="url(#warmPractical)"/>
    <rect width="1200" height="1200" fill="url(#floorGlow)"/>

    <!-- atmospheric haze -->
    <g opacity="0.62" filter="url(#softBlur)">
      <ellipse cx="420" cy="378" rx="470" ry="105" fill="#EDF3EE" opacity="0.10" transform="rotate(-13 420 378)"/>
      <ellipse cx="785" cy="520" rx="520" ry="122" fill="#DCE7DF" opacity="0.13" transform="rotate(-9 785 520)"/>
      <ellipse cx="625" cy="710" rx="690" ry="145" fill="#E8D9B8" opacity="0.10" transform="rotate(8 625 710)"/>
    </g>

    <!-- light beams from set fixtures -->
    <path d="M1020 118 L425 512 L1128 792 Z" fill="url(#creamBeam)" opacity="0.54"/>
    <path d="M212 95 L652 454 L114 666 Z" fill="url(#creamBeam)" opacity="0.25"/>
    <path d="M926 166 L681 558 L1133 536 Z" fill="#C7A668" opacity="0.13" filter="url(#softBlur)"/>

    <!-- background flats / set walls -->
    <g opacity="0.84">
      <path d="M122 300 L428 238 L445 806 L86 856 Z" fill="#143E2E" opacity="0.74"/>
      <path d="M446 246 L805 274 L785 852 L466 812 Z" fill="#0E2A20" opacity="0.86"/>
      <path d="M812 284 L1092 234 L1120 834 L792 856 Z" fill="#1C5440" opacity="0.6"/>
      <path d="M145 330 L401 283" stroke="#E8D9B8" stroke-opacity="0.16" stroke-width="10"/>
      <path d="M489 326 L742 345" stroke="#C7A668" stroke-opacity="0.14" stroke-width="8"/>
      <path d="M843 335 L1065 292" stroke="#E8D9B8" stroke-opacity="0.13" stroke-width="9"/>
    </g>

    <!-- studio grid and practical lamps -->
    <g stroke="#E8D9B8" stroke-linecap="round" opacity="0.34">
      <path d="M90 212 C323 158 697 151 1116 215" stroke-width="7"/>
      <path d="M292 174 L292 302" stroke-width="5"/>
      <path d="M922 178 L922 316" stroke-width="5"/>
    </g>
    <g>
      <circle cx="292" cy="323" r="45" fill="#C7A668" opacity="0.88"/>
      <circle cx="292" cy="323" r="105" fill="#C7A668" opacity="0.17" filter="url(#softBlur)"/>
      <circle cx="922" cy="336" r="54" fill="#E8D9B8" opacity="0.86"/>
      <circle cx="922" cy="336" r="132" fill="#E8D9B8" opacity="0.18" filter="url(#softBlur)"/>
    </g>

    <!-- blurred crew / talent moving through haze -->
    <g filter="url(#motionBlur)" opacity="0.58" fill="#FBF8F1">
      <ellipse cx="620" cy="520" rx="34" ry="41"/>
      <path d="M573 574 C602 548 646 548 675 577 L705 758 C657 779 600 779 548 760 Z"/>
      <ellipse cx="750" cy="552" rx="26" ry="34" opacity="0.75"/>
      <path d="M711 600 C740 580 779 582 800 608 L827 766 C785 782 742 781 697 766 Z" opacity="0.75"/>
      <ellipse cx="507" cy="578" rx="23" ry="31" opacity="0.55"/>
      <path d="M472 622 C494 604 525 604 546 626 L563 762 C527 775 489 775 454 762 Z" opacity="0.55"/>
    </g>
    <g filter="url(#motionBlur)" opacity="0.32" fill="#9BBFAC">
      <path d="M852 501 C906 493 944 535 940 604 C937 680 889 716 835 692 C793 674 777 597 803 545 C815 523 829 506 852 501Z"/>
      <path d="M360 505 C397 489 436 517 441 567 C448 634 415 699 361 696 C311 693 288 632 302 574 C310 541 329 518 360 505Z"/>
    </g>

    <!-- foreground camera and behind-the-camera context -->
    <g transform="translate(72 612)">
      <path d="M58 244 L286 196 L332 500 L96 540 Z" fill="#0A0A07" opacity="0.88"/>
      <path d="M238 250 L416 220 C454 214 483 245 478 283 L452 475 C447 511 415 535 379 527 L290 508 Z" fill="url(#lens)"/>
      <ellipse cx="459" cy="350" rx="73" ry="110" fill="#050604"/>
      <ellipse cx="454" cy="348" rx="36" ry="56" fill="#143E2E"/>
      <ellipse cx="446" cy="333" rx="16" ry="22" fill="#C7A668" opacity="0.52"/>
      <path d="M127 199 L180 92 L278 155 L247 217 Z" fill="#0A0A07" opacity="0.93"/>
      <path d="M319 203 L391 96 L462 175 L421 224 Z" fill="#0A0A07" opacity="0.93"/>
      <path d="M209 517 L171 770" stroke="#0A0A07" stroke-width="28" stroke-linecap="round"/>
      <path d="M295 512 L334 770" stroke="#0A0A07" stroke-width="28" stroke-linecap="round"/>
      <path d="M253 504 L253 790" stroke="#0A0A07" stroke-width="32" stroke-linecap="round"/>
      <path d="M122 255 L302 224" stroke="#E8D9B8" stroke-opacity="0.12" stroke-width="9"/>
    </g>

    <!-- floor, cables, dolly track -->
    <g opacity="0.62">
      <path d="M0 846 C313 788 596 790 1200 842 L1200 1200 L0 1200 Z" fill="#0A0A07" opacity="0.45"/>
      <path d="M128 973 C344 905 754 901 1052 970" fill="none" stroke="#C7A668" stroke-opacity="0.32" stroke-width="8"/>
      <path d="M99 1036 C365 956 773 956 1103 1033" fill="none" stroke="#E8D9B8" stroke-opacity="0.20" stroke-width="5"/>
      <path d="M694 901 C809 938 866 999 905 1085" fill="none" stroke="#0A0A07" stroke-opacity="0.72" stroke-width="20" stroke-linecap="round"/>
    </g>

    <!-- subtle brand-color vignette -->
    <rect width="1200" height="1200" fill="none" stroke="#EFE8D8" stroke-opacity="0.16" stroke-width="2"/>
    <rect width="1200" height="1200" fill="#0A0A07" opacity="0.16"/>
    <path d="M0 0 H1200 V1200 H0 Z" fill="none" stroke="#0B231A" stroke-width="120" stroke-opacity="0.34"/>
  </g>
</svg>
